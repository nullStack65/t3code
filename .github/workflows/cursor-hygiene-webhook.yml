name: Forward to Cursor hygiene

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, ready_for_review]
  issues:
    types: [opened, closed, reopened]
  discussion:
    types: [created, closed, reopened]

permissions:
  contents: read

jobs:
  forward:
    name: POST to Cursor
    if: >-
      github.repository_id == '1372173214' &&
      contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.actor) &&
      contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.triggering_actor) &&
      (github.event.pull_request == null ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.event.pull_request.user.login)))
    runs-on: t3code-ci-arc
    steps:
      - name: POST to Cursor
        env:
          URL: ${{ secrets.CURSOR_T3CODE_WEBHOOK_URL }}
          AUTH: ${{ secrets.CURSOR_T3CODE_WEBHOOK_AUTH }}
        run: |
          set -euo pipefail
          if [ -z "${URL:-}" ] || [ -z "${AUTH:-}" ]; then
            echo "Missing CURSOR_T3CODE_WEBHOOK_URL or CURSOR_T3CODE_WEBHOOK_AUTH — skipping."
            exit 0
          fi
          curl -fsS --max-time 60 -X POST "$URL" \
            -H "Authorization: $AUTH" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: ${{ github.event_name }}" \
            -H "X-GitHub-Delivery: ${{ github.run_id }}-${{ github.run_attempt }}" \
            --data-binary @"${{ github.event_path }}"
