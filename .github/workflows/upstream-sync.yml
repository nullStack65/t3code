name: Upstream fork sync

# Fetches pingdotgg/t3code main once a day. A clean merge becomes a pull
# request against release/native-0.1.10 after SHA admission. Conflicts use
# the same proposal for Platform / CTO triage. This workflow never merges that
# pull request and never force-pushes.
# It runs on the repository ARC scale set; it only fetches and merges git
# history and does not execute upstream code. The fork's ARC workflow still has to
# pass before anyone merges.
on:
  schedule:
    - cron: "15 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t3-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository_id == '1372173214' }}
    runs-on: t3code-ci-arc
    timeout-minutes: 30
    steps:
      - name: Checkout the release line
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: release/native-0.1.10
          fetch-depth: 0
          persist-credentials: false

      - name: Sync upstream main
        shell: bash
        env:
          UPSTREAM_URL: https://github.com/pingdotgg/t3code.git
          BASE_BRANCH: release/native-0.1.10
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.T3_FORK_SYNC_TOKEN }}
          ADMITTED_UPSTREAM_SHA: ${{ vars.T3_FORK_SYNC_ADMITTED_UPSTREAM_SHA }}
        run: bash scripts/upstream-sync.sh
