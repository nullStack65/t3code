name: CI

# Fork validation routing. Upstream schedules Blacksmith labels that this fork
# has no installation for, so those jobs queue forever. Every substantive job
# here instead runs on owner-admitted self-hosted capacity declared through the
# same repository variables the landed fork-release pipeline uses:
#   T3CODE_AUTHORIZED_RUNNERS  comma-separated labels this fork may use
#   T3CODE_LINUX_RUNNER        the admitted Linux validation label
#   T3CODE_MACOS_X64_RUNNER    the admitted Intel macOS validation label
# The `authorize` jobs validate the declared label against the authorized list
# before any checkout or install, so source never executes on unauthorized
# capacity. When capacity is not declared the run fails closed — an unschedulable
# startup, or the guard's CAPACITY_NOT_CONFIGURED/RUNNER_NOT_AUTHORIZED once a
# label is declared — rather than waiting on an unmatched label. External
# pull requests are never scheduled on self-hosted capacity. See
# docs/internals/fork-ci.md.
#
# The admission step is a small explicit bootstrap in this workflow. On the pull
# request that first introduces the routing guard, the guard does not exist at
# the PR base, so the bootstrap runs the identical policy inline instead of
# trying to load a missing file. Once the guard is on the default branch the
# bootstrap runs the checked-out guard from the trusted ref. Actions are pinned
# to immutable commit SHAs and every source checkout disables persisted
# credentials.
#
# Incremental upstream behavior is preserved: the same jobs, check names, test
# commands and coverage. Only the runner target, host-portability of setup and
# the security pins changed.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Admission runs first and owns the trust decision. Job-level `if` is
  # evaluated before a runner is allocated, so untrusted external PRs are
  # skipped instead of being scheduled on self-hosted capacity. Every other job
  # needs this one, so a skipped or failed admission also skips them.
  authorize:
    name: Authorize fork CI runners
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Checkout trusted routing guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts/fork-ci-routing.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Assert admitted Linux validation capacity
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          AUTHORIZED: ${{ vars.T3CODE_AUTHORIZED_RUNNERS }}
          T3CODE_LINUX_RUNNER: ${{ vars.T3CODE_LINUX_RUNNER }}
          REQUIRED_ROLES: linux
        run: |
          # >>> fork-ci-bootstrap >>>
          set -euo pipefail
          # First-introduction bootstrap. The routing guard is introduced by the change
          # that also adds this workflow, so it does not exist at the pull request base.
          # Run the checked-out trusted guard when it is present; otherwise enforce the
          # identical admission policy inline instead of silently executing unmerged
          # guard source. `.github/scripts/fork-ci-routing.test.py` runs this exact block.
          guard=".github/scripts/fork-ci-routing.sh"
          if [ -f "$guard" ]; then
            exec bash "$guard"
          fi

          EVENT_NAME="${EVENT_NAME:-}"
          HEAD_REPO="${HEAD_REPO:-}"
          REPOSITORY="${REPOSITORY:-}"
          AUTHORIZED="${AUTHORIZED:-}"
          REQUIRED_ROLES="${REQUIRED_ROLES:-linux}"

          fail() {
            printf '%s: %s\n' "$1" "$2" >&2
            exit "$3"
          }

          case "$EVENT_NAME" in
            pull_request | push) ;;
            *) fail UNTRUSTED_CONTEXT "unsupported event '$EVENT_NAME'; only pull_request and push are routed" 5 ;;
          esac
          [ -n "$REPOSITORY" ] || fail UNTRUSTED_CONTEXT "repository identity is empty; the event origin cannot be verified" 5
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            fail UNTRUSTED_FORK "pull request head '$HEAD_REPO' is not '$REPOSITORY'; external or unidentified PR code is never routed to self-hosted runner capacity" 3
          fi

          [ -n "$AUTHORIZED" ] || fail CAPACITY_NOT_CONFIGURED "repository variable T3CODE_AUTHORIZED_RUNNERS is unset or empty; set it to the comma-separated self-hosted runner labels this fork may use" 2

          admitted=""
          for role in $REQUIRED_ROLES; do
            case "$role" in
              linux) var=T3CODE_LINUX_RUNNER; label="${T3CODE_LINUX_RUNNER:-}" ;;
              macos) var=T3CODE_MACOS_X64_RUNNER; label="${T3CODE_MACOS_X64_RUNNER:-}" ;;
              *) fail CAPACITY_NOT_CONFIGURED "unknown required role '$role'" 2 ;;
            esac
            [ -n "$label" ] || fail CAPACITY_NOT_CONFIGURED "repository variable $var is unset or empty; no admitted $role validation capacity is declared" 2
            found=""
            IFS=','
            for candidate in $AUTHORIZED; do
              candidate="$(printf '%s' "$candidate" | tr -d '[:space:]')"
              if [ "$candidate" = "$label" ]; then found=1; break; fi
            done
            unset IFS
            [ -n "$found" ] || fail RUNNER_NOT_AUTHORIZED "declared $role runner '$label' is not listed in T3CODE_AUTHORIZED_RUNNERS" 4
            admitted="$admitted $role=$label"
          done
          printf 'ADMITTED%s\n' "$admitted"
          # <<< fork-ci-bootstrap <<<

  check:
    name: Check
    needs: [authorize]
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Reject repository-owned PR assets
        run: |
          files="$(git ls-files .github/pr-assets)"
          if test -n "$files"; then
            printf 'PR evidence must be uploaded to GitHub, not committed:\n%s\n' "$files" >&2
            exit 1
          fi

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      # Files/dependencies are repo-wide; export checks cover clean workspaces only.
      - name: Check unused code
        run: vp run knip:check

      - name: Check
        run: vp check

      - name: Check className overrides on components/ui do not grow
        run: vp run lint:restyle-ceiling

      - name: Typecheck
        run: vpr typecheck

      - name: Verify browser secret helper build libraries
        run: |
          # The admitted image must already carry these. CI never mutates host
          # packages: a missing prerequisite is an image defect that fails here
          # with the exact packages to provision, rather than a silent
          # `sudo apt-get` on whatever host happened to be selected.
          missing=""
          for pkg in libsecret-1-dev pkg-config; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              missing="${missing:+$missing }$pkg"
            fi
          done
          if [ -n "$missing" ]; then
            printf '::error::admitted runner image is missing required build libraries: %s. Provision them in the runner image; CI does not change host packages.\n' "$missing" >&2
            exit 1
          fi

      - name: Build desktop pipeline
        run: vp run build:desktop

      - name: Verify preload bundle output
        run: node apps/desktop/scripts/verify-preload-bundle.mjs

  # Everything except `t3` (apps/server). `--parallel` drops the package
  # dependency ordering that `vp run` applies by default: these `test` tasks
  # declare no `dependsOn` and resolve workspace deps from source, so ordering
  # only bought us idle runners between dependency layers. The concurrency
  # limit stays at the default 4 so peak load per runner is unchanged.
  test:
    name: Test
    needs: [authorize]
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Ensure Electron runtime is installed
        run: vp run --filter @t3tools/desktop ensure:electron

      - name: Verify browser secret helper build libraries
        run: |
          # The admitted image must already carry these. CI never mutates host
          # packages: a missing prerequisite is an image defect that fails here
          # with the exact packages to provision, rather than a silent
          # `sudo apt-get` on whatever host happened to be selected.
          missing=""
          for pkg in libsecret-1-dev pkg-config; do
            if ! dpkg -s "$pkg" >/dev/null 2>&1; then
              missing="${missing:+$missing }$pkg"
            fi
          done
          if [ -n "$missing" ]; then
            printf '::error::admitted runner image is missing required build libraries: %s. Provision them in the runner image; CI does not change host packages.\n' "$missing" >&2
            exit 1
          fi

      - name: Test preview artifact validation
        run: python3 -B .github/scripts/stage-preview-bundle.test.py

      - name: Test nightly release checks
        run: node --test .github/scripts/check-nightly-release.test.cjs

      - name: Test fork CI routing guards
        run: python3 -B .github/scripts/fork-ci-routing.test.py

      - name: Test
        run: vp run --parallel --concurrency-limit 4 --filter '!t3' --filter '!@t3tools/monorepo' test

  # apps/server sets `fileParallelism: false`, so its 239 files run strictly
  # one at a time. Sharding spreads them over separate runners instead of
  # separate workers, so no two server test files ever share a machine and the
  # isolation that flag buys is preserved exactly.
  test_server:
    name: Test Server ${{ matrix.shard }}
    needs: [authorize]
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      # No Electron setup here: `t3` (apps/server) has no Electron dependency
      # and none of its tests touch the runtime. Only the non-server `test`
      # job, which covers @t3tools/desktop, needs the download.
      - name: Test
        env:
          T3CODE_TRANSFER_BUDGET_REPORT_PATH: ${{ runner.temp }}/t3code-transfer-budget.md
          T3CODE_TRANSFER_BUDGET_RESULT_PATH: ${{ runner.temp }}/thread-transfer-result.json
        run: vp run --filter t3 test --shard ${{ matrix.shard }}/${{ strategy.job-total }}

      # src/server.test.ts writes the budget report, so exactly one shard
      # produces these files. Gating the upload on their presence keeps a
      # single `thread-transfer-results` artifact per run, which is the name
      # thread-transfer-report.yml resolves.
      - name: Detect transfer budget report
        id: transfer_budget
        if: always()
        run: |
          if test -f "${{ runner.temp }}/thread-transfer-result.json"; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish transfer budget report
        if: always() && steps.transfer_budget.outputs.present == 'true'
        run: |
          if test -f "${{ runner.temp }}/t3code-transfer-budget.md"; then
            tee -a "$GITHUB_STEP_SUMMARY" < "${{ runner.temp }}/t3code-transfer-budget.md"
          else
            echo "Transfer budget report was not produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload thread transfer result
        if: always() && steps.transfer_budget.outputs.present == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: thread-transfer-results
          path: ${{ runner.temp }}/thread-transfer-result.json
          if-no-files-found: ignore
          retention-days: 30

  # Split out of Check and Test: both paid ~7-9s to install a Rust toolchain
  # for checks that take under 3s, on the critical path of every PR.
  rust:
    name: Rust
    needs: [authorize]
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      # Discover crates instead of hardcoding them, so a new native crate is
      # checked the moment it lands rather than only after a second CI edit
      # (see docs/internals/fork-ci.md for the #10 windows-service-host wiring).
      - name: Check Rust formatting
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(native/*/Cargo.toml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No native/*/Cargo.toml crates were discovered" >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            cargo fmt --manifest-path "$manifest" -- --check
          done

      - name: Test Rust crates
        run: |
          set -euo pipefail
          shopt -s nullglob
          manifests=(native/*/Cargo.toml)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No native/*/Cargo.toml crates were discovered" >&2
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            cargo test --locked --manifest-path "$manifest"
          done

  # The static analysis below needs a macOS runner, so gate it on the native
  # sources it actually lints instead of paying for it on every push. Detection
  # is API-only (no checkout) and fails open: if the diff cannot be resolved,
  # the lint runs.
  mobile_native_changes:
    name: Mobile Native Changes
    needs: [authorize]
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      changed: ${{ steps.detect.outputs.changed }}
    steps:
      - name: Detect mobile native changes
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -uo pipefail

          fail_open() {
            echo "$* Running native static analysis."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          }

          count_rows() {
            printf '%s\n' "$1" | grep -c . || true
          }

          # One row per changed file, holding the new path and, for a rename,
          # the path it replaced: renaming a matched file out of the matched
          # paths removes a lint input just like editing it.
          row='[.filename, (.previous_filename // empty)] | @tsv'

          if [[ -n "${PR_NUMBER}" ]]; then
            # The PR files endpoint stops at 3000 files and pagination cannot
            # extend it, so cross-check against the count the PR itself reports.
            expected=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.changed_files') \
              || fail_open "Could not read the pull request."
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" --paginate --jq ".[] | ${row}") \
              || fail_open "Could not resolve changed files."

            listed=$(count_rows "$rows")
            if [[ "$listed" -lt "$expected" ]]; then
              fail_open "GitHub listed only ${listed} of ${expected} changed files."
            fi
          else
            rows=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${BEFORE_SHA}...${GITHUB_SHA}" --jq ".files[]? | ${row}") \
              || fail_open "Could not resolve changed files."

            # The compare endpoint reports at most 300 files and pagination does
            # not extend that list, so a full list may be hiding native changes.
            listed=$(count_rows "$rows")
            if [[ "$listed" -ge 300 ]]; then
              fail_open "GitHub listed ${listed} changed files, the compare endpoint maximum."
            fi
          fi

          paths=$(tr '\t' '\n' <<< "$rows")

          # Sources scripts/mobile-native-static-check.ts lints, plus the tool
          # and rule configuration that decides how it lints them, plus the
          # root package.json that defines the lint:mobile command.
          pattern='^apps/mobile/.*\.(swift|kt|kts)$|^apps/mobile/(\.swiftlint\.yml|detekt\.yml|\.editorconfig|Brewfile)$|^scripts/mobile-native-static-check\.ts$|^package\.json$|^\.github/workflows/ci\.yml$'

          if grep -qE "$pattern" <<< "$paths"; then
            echo "Native sources or lint configuration changed:"
            grep -E "$pattern" <<< "$paths"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No mobile native sources or lint configuration changed."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # macOS capacity is validated separately, and only when the macOS job will
  # actually run, so a fork with Linux-only capacity is not blocked on every PR.
  # The gate itself runs on admitted Linux capacity.
  authorize_macos:
    name: Authorize fork macOS validation capacity
    needs: [authorize, mobile_native_changes]
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' && needs.authorize.result == 'success' && needs.mobile_native_changes.result == 'success' }}
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 5
    steps:
      - name: Checkout trusted routing guard
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          sparse-checkout: .github/scripts/fork-ci-routing.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Assert admitted macOS validation capacity
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          AUTHORIZED: ${{ vars.T3CODE_AUTHORIZED_RUNNERS }}
          T3CODE_MACOS_X64_RUNNER: ${{ vars.T3CODE_MACOS_X64_RUNNER }}
          REQUIRED_ROLES: macos
        run: |
          # >>> fork-ci-bootstrap >>>
          set -euo pipefail
          # First-introduction bootstrap. The routing guard is introduced by the change
          # that also adds this workflow, so it does not exist at the pull request base.
          # Run the checked-out trusted guard when it is present; otherwise enforce the
          # identical admission policy inline instead of silently executing unmerged
          # guard source. `.github/scripts/fork-ci-routing.test.py` runs this exact block.
          guard=".github/scripts/fork-ci-routing.sh"
          if [ -f "$guard" ]; then
            exec bash "$guard"
          fi

          EVENT_NAME="${EVENT_NAME:-}"
          HEAD_REPO="${HEAD_REPO:-}"
          REPOSITORY="${REPOSITORY:-}"
          AUTHORIZED="${AUTHORIZED:-}"
          REQUIRED_ROLES="${REQUIRED_ROLES:-linux}"

          fail() {
            printf '%s: %s\n' "$1" "$2" >&2
            exit "$3"
          }

          case "$EVENT_NAME" in
            pull_request | push) ;;
            *) fail UNTRUSTED_CONTEXT "unsupported event '$EVENT_NAME'; only pull_request and push are routed" 5 ;;
          esac
          [ -n "$REPOSITORY" ] || fail UNTRUSTED_CONTEXT "repository identity is empty; the event origin cannot be verified" 5
          if [ "$EVENT_NAME" = "pull_request" ] && [ "$HEAD_REPO" != "$REPOSITORY" ]; then
            fail UNTRUSTED_FORK "pull request head '$HEAD_REPO' is not '$REPOSITORY'; external or unidentified PR code is never routed to self-hosted runner capacity" 3
          fi

          [ -n "$AUTHORIZED" ] || fail CAPACITY_NOT_CONFIGURED "repository variable T3CODE_AUTHORIZED_RUNNERS is unset or empty; set it to the comma-separated self-hosted runner labels this fork may use" 2

          admitted=""
          for role in $REQUIRED_ROLES; do
            case "$role" in
              linux) var=T3CODE_LINUX_RUNNER; label="${T3CODE_LINUX_RUNNER:-}" ;;
              macos) var=T3CODE_MACOS_X64_RUNNER; label="${T3CODE_MACOS_X64_RUNNER:-}" ;;
              *) fail CAPACITY_NOT_CONFIGURED "unknown required role '$role'" 2 ;;
            esac
            [ -n "$label" ] || fail CAPACITY_NOT_CONFIGURED "repository variable $var is unset or empty; no admitted $role validation capacity is declared" 2
            found=""
            IFS=','
            for candidate in $AUTHORIZED; do
              candidate="$(printf '%s' "$candidate" | tr -d '[:space:]')"
              if [ "$candidate" = "$label" ]; then found=1; break; fi
            done
            unset IFS
            [ -n "$found" ] || fail RUNNER_NOT_AUTHORIZED "declared $role runner '$label' is not listed in T3CODE_AUTHORIZED_RUNNERS" 4
            admitted="$admitted $role=$label"
          done
          printf 'ADMITTED%s\n' "$admitted"
          # <<< fork-ci-bootstrap <<<

  mobile_native_static_analysis:
    name: Mobile Native Static Analysis
    needs: [authorize, mobile_native_changes, authorize_macos]
    # Skip only on an explicit "no": a gate job that failed or errored leaves the
    # output empty, and that must run the lint rather than silently skip it. The
    # authorize results keep a failed or skipped admission from being bypassed.
    if: ${{ !cancelled() && needs.mobile_native_changes.outputs.changed != 'false' && needs.authorize.result == 'success' && needs.authorize_macos.result == 'success' }}
    runs-on: ${{ vars.T3CODE_MACOS_X64_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Install mobile native static analysis tools
        run: brew bundle install --file apps/mobile/Brewfile

      - name: Lint mobile native sources
        run: vp run lint:mobile

  release_smoke:
    name: Release Smoke
    needs: [authorize]
    runs-on: ${{ vars.T3CODE_LINUX_RUNNER }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - name: Exercise release-only workflow steps
        run: node scripts/release-smoke.ts
