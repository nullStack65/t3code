            | awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced && /^Deploy:/' || true)"
          count="$(printf '%s' "$lines" | grep -c . || true)"
          value="$(printf '%s' "$lines" | sed -E 's/^Deploy:[[:space:]]*//; s/[[:space:]]+$//')"
          if test "$count" -ne 1 || test "$value" != none; then
            echo "::error::The upstream-sync App runs on ARC only with exactly one 'Deploy: none' line."
            exit 1
          fi

      - name: Checkout trusted source (no persistent credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Provide libatomic for official Node binaries
        uses: ./.github/actions/provide-libatomic

      - name: Install locked dependencies from cache
        uses: ./.github/actions/setup-ci-deps
        with:
          save-pnpm-store: "false"

      - name: Gate interaction latency at 400 ms
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          export PLAYWRIGHT_BROWSERS_PATH="$RUNNER_TEMP/ms-playwright"
          vp exec playwright install --only-shell chromium
          shell=$(find "$PLAYWRIGHT_BROWSERS_PATH" -type f -name chrome-headless-shell | head -1)
          if ! test -x "$shell"; then
            echo "::error::Playwright installed no chrome-headless-shell under $PLAYWRIGHT_BROWSERS_PATH."
            exit 1
          fi
          packages=(libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 libpango-1.0-0
            libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxkbcommon0 libxrandr2)
          # -o Dir::Etc is applied after apt has already read /etc/apt/apt.conf.d, so the
          # image Post-Invoke still runs and its rm of /var/cache/apt/archives/partial fails
          # the step. APT_CONFIG is read first, which is what points Dir::Etc away from
          # those hooks. Downloads stay under the job temp dir. Status stays the image
          # dpkg database, so apt fetches only libraries the image does not already have
          # and the extract does not replace the image libc.
          apt_dir="$RUNNER_TEMP/chromium-apt"
          mkdir -p "$apt_dir/etc/apt.conf.d" "$apt_dir/etc/sources.list.d" "$apt_dir/etc/preferences.d" \
            "$apt_dir/lists/partial" "$apt_dir/archives/partial" "$apt_dir/root"
          printf '%s\n' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main universe' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main universe' \
            'deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main universe' \
            > "$apt_dir/etc/sources.list"
          cat > "$apt_dir/apt.conf" <<EOF
          Dir::Etc "$apt_dir/etc";
          Dir::Etc::sourcelist "$apt_dir/etc/sources.list";
          Dir::Etc::sourceparts "$apt_dir/etc/sources.list.d";
          Dir::Etc::parts "$apt_dir/etc/apt.conf.d";
          Dir::State::lists "$apt_dir/lists";
          Dir::State::status "/var/lib/dpkg/status";
          Dir::Cache::archives "$apt_dir/archives";
          Dir::Cache::pkgcache "$apt_dir/pkgcache.bin";
          Dir::Cache::srcpkgcache "$apt_dir/srcpkgcache.bin";
          Debug::NoLocking "1";
          APT::Get::List-Cleanup "0";
          EOF
          sed -i -E 's/^[[:space:]]+//' "$apt_dir/apt.conf"
          export APT_CONFIG="$apt_dir/apt.conf"
          apt-get update -qq
          apt-get -qq install --download-only --no-install-recommends -y "${packages[@]}"
          shopt -s nullglob
          debs=("$apt_dir"/archives/*.deb)
          shopt -u nullglob
          for deb in "${debs[@]}"; do dpkg-deb -x "$deb" "$apt_dir/root"; done
          export LD_LIBRARY_PATH="$apt_dir/root/usr/lib/x86_64-linux-gnu:$apt_dir/root/lib/x86_64-linux-gnu${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p "$RUNNER_TEMP/fontconfig-cache"
          printf '<?xml version="1.0"?>\n<fontconfig><dir>/usr/share/fonts</dir><dir>%s</dir><cachedir>%s</cachedir></fontconfig>\n' \
            "$apt_dir/root/usr/share/fonts" "$RUNNER_TEMP/fontconfig-cache" > "$RUNNER_TEMP/fonts.conf"
          export FONTCONFIG_FILE="$RUNNER_TEMP/fonts.conf"
          fonts=0
          for font_dir in /usr/share/fonts "$apt_dir/root/usr/share/fonts"; do
            if test -d "$font_dir"; then
              fonts=$((fonts + $(find "$font_dir" -name '*.ttf' | wc -l)))
            fi
          done
          if test "$fonts" -eq 0; then
            echo "::error::No fonts for headless Chromium, so text has no size and is never visible."
            exit 1
          fi
          printf 'Fonts available to Chromium: %s\n' "$fonts"
          if ldd "$shell" | grep 'not found'; then
            echo "::error::Headless Chromium still misses the libraries above."
            exit 1
          fi
          vp run test:latency

      - name: Test mobile new-task placement, outbox and uploads
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          vp test run \
            src/state/thread-placement.model.test.ts \
            src/state/threadOutboxDelivery.placement.test.ts \
            src/state/composer-attachment-uploads.test.ts \
            src/lib/composerAttachmentUploadQueue.test.ts \
            src/lib/attachmentUpload.test.ts \
            src/state/use-composer-drafts.test.ts \
            src/state/thread-outbox.test.ts \
            src/state/threadOutboxDelivery.permissions.test.ts \
            src/state/threadOutboxDelivery.test.ts \
            src/state/pending-thread-creation.test.ts \
            src/lib/projectThreadStartTurn.test.ts \
            src/features/threads/thread-route-state.test.ts \
            src/features/threads/new-task-flow-provider.test.tsx \
            src/features/home/pendingTaskRoute.test.tsx \
            src/features/threads/NewTaskDraftRouteScreen.test.tsx

      - name: Provide Chromium libraries for the voice latency browser test
        uses: ./.github/actions/provide-chromium-libs

      # The browser binary is the slow download. It is keyed on the Playwright
      # version this lockfile resolves, so a bump refetches and everything else
      # restores. The path is the runner temp dir, which is wiped between jobs,
      # so nothing stale survives a version change.
      - name: Restore Playwright Chromium
        id: playwright_cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Test voice press-to-recording and release-to-text stay under 400 ms
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          set -euo pipefail
          vp exec playwright install --only-shell chromium
          vp test run --project browser -t "records within 400 ms" \
            src/speech/voiceInputLatency.browser.test.ts \
            src/speech/useEnvironmentSpeechInput.browser.test.tsx

      - name: Save Playwright Chromium
        if: steps.playwright_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/playwright-browsers
          key: ${{ steps.playwright_cache.outputs.cache-primary-key }}

  # Reports the exact check name the release-native-protection ruleset requires.
  # It runs no build and installs no workspace dependencies. The ARC image has
  # no `node` on PATH, so this job sets up the repo's Node before the coverage
  # guard. It fails when any worker failed, was cancelled, or was skipped. A
  # skipped worker means the trust gate refused the run, and a required check
  # must not turn green for a run that did no work.
  #
  # `if: always()` would also start this job when the workflow is cancelled, and
  # a worker that never started reports `success`. The concurrency group cancels
  # the previous in-progress run on every new push, so that would mark the
  # required check green for a run whose tests never ran. `!cancelled()` still
  # runs when a worker failed or was skipped.
  #
  # On a draft pull request the workers are skipped and this job fails at its
  # first step, so the required check stays red until the full run passes. It
  # reads only the event payload there. GitHub-hosted runners are forbidden,
  # so even this draft hold runs on the ARC scale set.
  voice-and-inbox:
    name: Voice + founder inbox (Linux ARC)
    needs: [voice-and-inbox-core, voice-and-inbox-web, voice-and-inbox-mobile]
    if: ${{ !cancelled() }}
    runs-on: t3code-ci-arc
    timeout-minutes: 5
    steps:
      - name: Hold drafts until ready for review
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
        shell: bash
        run: |
          echo "::error::Draft pull request: the ARC workers run when it is marked ready for review."
          exit 1

      # Before any checkout: a run whose workers failed or were skipped (for
      # example a rejected fork PR) fails here without executing PR content.
      - name: Report the three workers
        shell: bash
        env:
          CORE: ${{ needs.voice-and-inbox-core.result }}
          WEB: ${{ needs.voice-and-inbox-web.result }}
          MOBILE: ${{ needs.voice-and-inbox-mobile.result }}
        run: |
          set -euo pipefail
          printf 'core=%s web=%s mobile=%s\n' "$CORE" "$WEB" "$MOBILE"
          for result in "$CORE" "$WEB" "$MOBILE"; do
            test "$result" = success
          done

      - name: Checkout trusted source (no persistent credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          # package.json is the Node version file. Cone mode on Git 2.43 accepts
          # that root file alongside the .github directory.
          sparse-checkout: |
            .github
            package.json

      # Official Node 26 links libatomic.so.1, which this image does not ship.
      # The library path has to be set before setup-node runs that binary.
      - name: Provide libatomic for official Node binaries
        uses: ./.github/actions/provide-libatomic

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: package.json

      # Fails the required check when a worker no longer runs one of the 48
      # tests the serial job ran, so coverage cannot shrink without this going red.
      - name: Guard the parallel coverage
        shell: bash
        run: node .github/scripts/arc-ci-coverage.cjs

      # Proves the worker gates still admit only the founders and the exact
      # upstream-sync App shape, and that all three workers share one gate.
      - name: Test the ARC trust gate
        shell: bash
        run: node --test .github/scripts/arc-ci-trust-gate.test.cjs .github/scripts/no-hosted-runners.test.cjs
