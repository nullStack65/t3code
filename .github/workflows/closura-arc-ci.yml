name: T3 fork ARC CI

# Self-hosted, repository-scoped ARC only. No paid Blacksmith, hosted fallback,
# macOS/Windows runners, new controller or deployment side effects.
on:
  push:
    # Every merged head of the native release branch gets a check run on its
    # exact commit; the private fleet rollout builds only commits that passed.
    branches: [feat/assemblyai-current, release/native-0.1.10]
  pull_request:
    # `edited` covers retargeting a PR onto a release branch. Without it, a PR
    # whose commits were all pushed before the retarget merged with no ARC run.
    # A founder's edit reruns the full job. An edit by anyone else (for example
    # CodeRabbit rewriting the description) starts a run whose job is skipped;
    # the concurrency group below keeps it from cancelling the real run.
    types: [opened, synchronize, reopened, edited]
    branches: [feat/assemblyai-current, release/native-0.1.10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Pushes group by exact commit, so a burst of merges never cancels a queued
  # head: every merged head keeps its own check run. PR runs also group by the
  # triggering actor, so a bot's edit-triggered (skipped) run never cancels a
  # founder's in-progress run.
  group: t3-fork-arc-${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.triggering_actor || 'x' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  voice-and-inbox:
    # This is a public fork. Never run untrusted PR code on the private ARC LAN.
    # Same-repo PR + trusted human author/actor only; push and manual runs
    # require an authorized actor and one of the two exact branches above.
    if: >-
      ${{
        github.repository == 'nullStack65/t3code' &&
        (
          (github.event_name == 'pull_request' &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.event.pull_request.user.login) &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.actor) &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.triggering_actor))
          ||
          (github.event_name != 'pull_request' &&
           (github.ref == 'refs/heads/feat/assemblyai-current' ||
            github.ref == 'refs/heads/release/native-0.1.10') &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.actor))
        )
      }}
    name: Voice + founder inbox (Linux ARC)
    runs-on: t3code-ci-arc
    timeout-minutes: 90
    env:
      CI: "true"
      GIT_CONFIG_NOSYSTEM: "1"
      NODE_OPTIONS: "--max-old-space-size=3072"
      GOMAXPROCS: "2"
    steps:
      - name: Checkout trusted source (no persistent credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Prove exact ARC repository and worker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'nullStack65/t3code'
          test -n "${RUNNER_NAME:-}"
          test "$RUNNER_OS" = Linux
          printf 'T3 ARC: repo=%s runner=%s ref=%s source=%s\n' \
            "$GITHUB_REPOSITORY" "$RUNNER_NAME" "$GITHUB_REF" "$(git rev-parse HEAD)"

      - name: Provide libatomic for official Node binaries
        shell: bash
        run: |
          set -euo pipefail
          # Official Node 26 linux-x64 binaries link libatomic.so.1. The pinned
          # actions-runner image (dotnet runtime-deps:8.0-noble) lacks it, and
          # the ARC pod cannot use sudo/apt (no privilege escalation). Without
          # it, Vite+ self-setup fails with exit 127. Use Ubuntu noble's
          # immutable release-pocket package, pinned by SHA-256.
          lib_system=/usr/lib/x86_64-linux-gnu/libatomic.so.1
          if test -e "$lib_system"; then
            printf 'libatomic present at %s\n' "$lib_system"
            exit 0
          fi
          test "$(uname -m)" = x86_64
          deb_url='https://archive.ubuntu.com/ubuntu/pool/main/g/gcc-14/libatomic1_14-20240412-0ubuntu1_amd64.deb'
          deb_sha256='f496d80626e1512456273965d44f47b281edf53fa26d0d8bd0defc5be7e4601c'
          dir="$RUNNER_TEMP/libatomic"
          mkdir -p "$dir"
          curl -fsSL --connect-timeout 10 --max-time 120 -o "$dir/libatomic1.deb" "$deb_url"
          printf '%s  %s\n' "$deb_sha256" "$dir/libatomic1.deb" | sha256sum -c -
          dpkg-deb -x "$dir/libatomic1.deb" "$dir/root"
          lib_dir="$dir/root/usr/lib/x86_64-linux-gnu"
          test -f "$lib_dir/libatomic.so.1"
          printf 'LD_LIBRARY_PATH=%s\n' "$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Set up pinned Node, pnpm and Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1.15.0
        env:
          VP_DOWNLOAD_TIMEOUT: "120"
        with:
          node-version-file: package.json
          cache: false
          run-install: false

      # After Node. The ARC image has no `node` until setup-vp, so running this
      # earlier exits 127 before the receipt can measure anything.
      - name: Fork drift receipt
        run: |
          # The checkout is shallow (`fetch-depth: 2`) and only has the
          # triggering ref. A plain `git fetch` of another ref keeps the
          # shallow boundary, and the merge-base between the release line and
          # upstream/main sits hundreds of commits behind it, so `git
          # merge-base` fails and the receipt exits 2. Drop the boundary first.
          # `--unshallow` errors on a complete clone, so only pass it while
          # `.git/shallow` exists. `--filter=blob:none` fetches the commit graph
          # without file contents.
          unshallow=()
          if [ -f .git/shallow ]; then unshallow=(--unshallow); fi
          git fetch --no-tags --filter=blob:none "${unshallow[@]}" origin "${{ github.base_ref || github.ref_name }}:refs/remotes/origin/${{ github.base_ref || github.ref_name }}"
          git fetch --no-tags --filter=blob:none https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          node --test scripts/fork-drift-receipt.test.mjs
          # Exit 1 means the release line is past its drift budget, which is
          # reported rather than failed. Exit 2 means the receipt itself broke.
          node scripts/fork-drift-receipt.mjs --base "origin/${{ github.base_ref || github.ref_name }}" || rc=$?
          if [ "${rc:-0}" -eq 2 ]; then exit 2; fi
        shell: bash

      - name: Install locked dependencies
        shell: bash
        run: vp install

      - name: Guard indispensable AssemblyAI voice implementation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const required = {
            'apps/server/src/speech/CloudSpeech.ts': ['assemblyai', 'sync.assemblyai.com/v1/transcribe', 'word_boost'],
            'apps/server/src/speech/CloudSpeech.test.ts': ['AssemblyAI', 'assemblyai'],
            'packages/contracts/src/speech.ts': ['assemblyai'],
            'apps/web/src/components/settings/CloudVoiceConfiguration.tsx': ['assemblyai'],
            'packages/contracts/src/threadInbox.ts': ['matchesInboxView', 'matchesInboxFilter', 'agent-only'],
            'packages/client-runtime/src/state/threadListFilter.ts': ['matchesPrimaryInbox', 'matchesListedInboxes', 'hiddenEnvironmentIds'],
            'apps/web/src/components/sidebar/SidebarThreadFilterMenu.tsx': ['Kameron', 'Jeff', 'Agents', 'Environments'],
            'apps/web/src/components/sidebar/threadListFilter.logic.ts': ['matchesListedInboxes', 'hiddenEnvironmentIds'],
          };
          for (const [file, needles] of Object.entries(required)) {
            const source = readFileSync(file, 'utf8');
            for (const needle of needles) {
              if (!source.includes(needle)) throw new Error(file + ' missing ' + needle);
            }
          }
          process.stdout.write('AssemblyAI voice + shared founder inbox source preserved\n');
          NODE

      - name: Typecheck contracts, runtime, provider and server
        shell: bash
        run: |
          set -euo pipefail
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/shared typecheck
          vp run --filter @t3tools/client-runtime typecheck
          vp run --filter @t3tools/provider-core typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/mobile typecheck

      - name: Test AssemblyAI dictation, native inbox and thread placement behavior
        shell: bash
        run: |
          set -euo pipefail
          vp test run \
            apps/server/src/speech/CloudSpeech.test.ts \
            apps/server/src/speech/GroqSpeechStream.test.ts \
            apps/server/src/speech/stream.test.ts \
            packages/contracts/src/threadInbox.test.ts \
            packages/contracts/src/threadInbox.invariants.test.ts \
            packages/contracts/src/threadInbox.upgrade.test.ts \
            packages/contracts/src/threadMetadataMcp.test.ts \
            apps/web/src/components/threadActionMenu.logic.test.ts \
            apps/web/src/components/sidebar/threadListFilter.logic.test.ts \
            packages/client-runtime/src/state/threadAttribution.test.ts \
            apps/server/src/orchestration-v2/ThreadLaunchService.test.ts \
            apps/server/src/orchestration-v2/SubagentProjection.test.ts \
            apps/server/src/orchestration-v2/ModelAlertReactor.test.ts \
            apps/server/src/orchestration-v2/ThreadEventAlerts.test.ts \
            apps/server/src/orchestration-v2/DelegatedCompletionDelivery.test.ts \
            packages/shared/src/threadPlacement.test.ts \
            apps/server/src/peer/RemoteDelegation.test.ts \
            apps/server/src/mcp/OrchestratorMcpService.test.ts \
            apps/server/src/cli/thread.test.ts \
            apps/web/src/composerDraftStore.test.ts \
            packages/client-runtime/src/voice-input/controller.test.ts \
            apps/web/src/components/chat/composerSend.logic.test.ts \
            apps/web/src/components/chat/chatViewSend.test.ts \
            apps/web/src/components/chat/composerImagePersistence.test.ts \
            apps/web/src/components/chat/draftPlacement.test.ts \
            apps/web/src/components/chat/draftAttachmentUploads.test.ts \
            apps/web/src/components/chat/draftUploadReconcile.test.ts \
            apps/web/src/lib/attachmentUploadQueue.test.ts \
            apps/server/src/ws.test.ts \
            packages/contracts/src/environment.test.ts \
            scripts/feature-map.test.ts

      - name: Test mobile new-task placement, outbox and uploads
        shell: bash
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          vp test run \
            src/state/thread-placement.model.test.ts \
            src/state/threadOutboxDelivery.placement.test.ts \
            src/state/composer-attachment-uploads.test.ts \
            src/lib/composerAttachmentUploadQueue.test.ts \
            src/lib/attachmentUpload.test.ts \
            src/state/use-composer-drafts.test.ts \
            src/state/thread-outbox.test.ts \
            src/state/threadOutboxDelivery.permissions.test.ts \
            src/state/threadOutboxDelivery.test.ts \
            src/state/pending-thread-creation.test.ts \
            src/lib/projectThreadStartTurn.test.ts \
            src/features/threads/thread-route-state.test.ts \
            src/features/threads/new-task-flow-provider.test.tsx \
            src/features/home/pendingTaskRoute.test.tsx \
            src/features/threads/NewTaskDraftRouteScreen.test.tsx

      - name: Provide Chromium libraries for the voice latency browser test
        shell: bash
        run: |
          set -euo pipefail
          if test -e /usr/lib/x86_64-linux-gnu/libnspr4.so; then
            printf 'Chromium libraries present\n'
            exit 0
          fi
          dir="$RUNNER_TEMP/chromium-libs"
          mkdir -p "$dir/lists/partial" "$dir/cache/archives/partial" "$dir/root"
          apt_opts=(-o Debug::NoLocking=1 -o Dir::State::Lists="$dir/lists" -o Dir::Cache="$dir/cache")
          apt-get "${apt_opts[@]}" -qq update
          apt-get "${apt_opts[@]}" -qq install --download-only --no-install-recommends -y \
            libasound2t64 libatk-bridge2.0-0t64 libatk1.0-0t64 libatspi2.0-0t64 libcairo2 \
            libcups2t64 libdbus-1-3 libdrm2 libgbm1 libglib2.0-0t64 libnspr4 libnss3 \
            libpango-1.0-0 libx11-6 libxcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 \
            libxkbcommon0 libxrandr2
          for deb in "$dir"/cache/archives/*.deb; do dpkg-deb -x "$deb" "$dir/root"; done
          lib_dir="$dir/root/usr/lib/x86_64-linux-gnu"
          test -f "$lib_dir/libnspr4.so"
          printf 'LD_LIBRARY_PATH=%s\n' "$lib_dir${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Test voice press-to-recording and release-to-text stay under 400 ms
        shell: bash
        working-directory: apps/web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          set -euo pipefail
          vp exec playwright install --only-shell chromium
          vp test run --project browser -t "records within 400 ms" \
            src/speech/voiceInputLatency.browser.test.ts \
            src/speech/useEnvironmentSpeechInput.browser.test.tsx

      - name: Build native T3 server
        shell: bash
        run: vp run --filter t3 build:bundle

      - name: Build founder inbox and voice settings web client
        shell: bash
        run: vp run --filter @t3tools/web build

      - name: Verify compiled release outputs
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/dist/bin.mjs
          test -d apps/web/dist
          printf 'Exact T3 source %s, voice and inbox builds successful on %s\n' \
            "$(git rev-parse HEAD)" "$RUNNER_NAME"
