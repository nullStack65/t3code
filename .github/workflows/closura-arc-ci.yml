name: T3 fork ARC CI

# Self-hosted, repository-scoped ARC only. No paid Blacksmith, macOS/Windows
# runners, new controller or deployment side effects. GitHub-hosted runners are
# forbidden outright, and burst capacity is
# Hetzner ARC nodes only (closura-agent-config scripts/arc_burst_nodes.py).
# .github/scripts/no-hosted-runners.test.cjs fails any workflow that says otherwise.
on:
  push:
    # Every merged head of the native release branch gets a check run on its
    # exact commit; the private fleet rollout builds only commits that passed.
    branches: [feat/assemblyai-current, release/native-0.1.10]
  pull_request:
    # `edited` covers retargeting a PR onto a release branch. Without it, a PR
    # whose commits were all pushed before the retarget merged with no ARC run.
    # A founder's edit reruns the full job. An edit by anyone else (for example
    # CodeRabbit rewriting the description) starts a run whose job is skipped;
    # the concurrency group below keeps it from cancelling the real run.
    # Draft pull requests skip the three ARC workers, so parked drafts use no
    # ARC time. `ready_for_review` starts the full run when a draft is marked ready.
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
    branches: [feat/assemblyai-current, release/native-0.1.10]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Release pushes need a result for every commit for fleet rollout. Distinct
  # run IDs also prevent GitHub from replacing an older pending release run.
  # PR runs remain isolated by actor so an edit from a bot cannot cancel CI.
  group: >-
    t3-fork-arc-${{ github.workflow }}-${{
      github.event.pull_request.number || github.ref
    }}-${{
      github.event_name == 'pull_request' && github.triggering_actor ||
      (github.event_name != 'push' || github.ref == 'refs/heads/release/native-0.1.10') && github.run_id ||
      'latest'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/assemblyai-current') }}

jobs:
  # The former single job ran every step in series, so one runner held the
  # whole 8-15 minute critical path. The work splits into independent workers
  # that share nothing but the source tree. The ruleset `release-native-protection`
  # requires the check name "Voice + founder inbox (Linux ARC)" exactly, so the
  # tiny aggregator job below keeps that name and the workers do the work.
  voice-and-inbox-core:
    # This is a public fork. Never run untrusted PR code on the private ARC LAN.
    # Same-repo PR + trusted human author/actor only; push and manual runs
    # require an authorized actor and one of the two exact branches above.
    # The one non-human author is the Closura upstream-sync GitHub App
    # (CLO-1110), admitted only by its exact login and numeric id, on a
    # same-repo `sync/upstream-` branch into the release line, with a
    # `Deploy: none` line in the body. A login ending in `[bot]` cannot be
    # registered by a person. The same clause gates all three workers;
    # .github/scripts/arc-ci-trust-gate.test.cjs keeps them identical.
    if: >-
      ${{
        github.repository_id == '1372173214' &&
        (
          (github.event_name == 'pull_request' &&
           !github.event.pull_request.draft &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.event.pull_request.user.login) &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.actor) &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.triggering_actor))
          ||
          (github.event_name == 'pull_request' &&
           !github.event.pull_request.draft &&
           github.event.pull_request.head.repo.full_name == github.repository &&
           github.event.pull_request.base.ref == 'release/native-0.1.10' &&
           startsWith(github.event.pull_request.head.ref, 'sync/upstream-') &&
           github.event.pull_request.user.login == 'closura-t3code-upstream-sync[bot]' &&
           github.event.pull_request.user.id == 360477638 &&
           github.actor == 'closura-t3code-upstream-sync[bot]' &&
           github.actor_id == '360477638' &&
           github.triggering_actor == 'closura-t3code-upstream-sync[bot]' &&
           contains(format(fromJSON('"\n{0}\n"'), github.event.pull_request.body), fromJSON('"\nDeploy: none\n"')) &&
           !contains(github.event.pull_request.body, 'Deploy: fleet'))
          ||
          (github.event_name != 'pull_request' &&
           (github.ref == 'refs/heads/feat/assemblyai-current' ||
            github.ref == 'refs/heads/release/native-0.1.10') &&
           contains(fromJSON('["nullStack65","jeffreysmithclosura"]'), github.actor))
        )
      }}
    name: Voice + inbox core (Linux ARC)
    runs-on: t3code-ci-arc
    timeout-minutes: 45
    env:
      CI: "true"
      GIT_CONFIG_NOSYSTEM: "1"
      NODE_OPTIONS: "--max-old-space-size=3072"
      GOMAXPROCS: "2"
    steps:
      # The App's `if:` clause above is only a prefilter. Before any checkout,
      # parse its Deploy line exactly as closura-deploy-line.yml does (one
      # unfenced `^Deploy:` line, whitespace stripped) and require `none`. Reads
      # only the event payload; runs no PR code.
      - name: Require Deploy none from the upstream-sync App
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.user.id == 360477638 }}
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          lines="$(printf '%s\n' "${PR_BODY:-}" | tr -d '\r' \
            | awk '/^[[:space:]]*(```|~~~)/ { fenced = !fenced; next } !fenced && /^Deploy:/' || true)"
          count="$(printf '%s' "$lines" | grep -c . || true)"
          value="$(printf '%s' "$lines" | sed -E 's/^Deploy:[[:space:]]*//; s/[[:space:]]+$//')"
          if test "$count" -ne 1 || test "$value" != none; then
            echo "::error::The upstream-sync App runs on ARC only with exactly one 'Deploy: none' line."
            exit 1
          fi

      - name: Checkout trusted source (no persistent credentials)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout: |
            /*
            !/.repos/
            !/apps/mobile/modules/t3-terminal/Vendor/**/*.a
          sparse-checkout-cone-mode: false

      - name: Prove exact ARC repository and worker
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY_ID" = '1372173214'
          test -n "${RUNNER_NAME:-}"
          test "$RUNNER_OS" = Linux
          printf 'T3 ARC: repo=%s runner=%s ref=%s source=%s\n' \
            "$GITHUB_REPOSITORY" "$RUNNER_NAME" "$GITHUB_REF" "$(git rev-parse HEAD)"

      - name: Provide libatomic for official Node binaries
        uses: ./.github/actions/provide-libatomic

      # setup-vp's own cache cannot see the pnpm store on a self-hosted runner
      # that starts from a clean workspace, so caching goes through the shared
      # action: the Vite+ home, the pnpm store and the lockfile verification
      # record, keyed on the lockfile. This job installs the whole workspace and
      # is the one that saves the store; the other two restore it.
      - name: Install locked dependencies from cache
        uses: ./.github/actions/setup-ci-deps

      # After Node. The ARC image has no `node` until setup-ci-deps, so running
      # this earlier exits 127 before the receipt can measure anything.
      - name: Fork drift receipt
        run: |
          # The checkout is shallow (`fetch-depth: 2`) and only has the
          # triggering ref. A plain `git fetch` of another ref keeps the
          # shallow boundary, and the merge-base between the release line and
          # upstream/main sits hundreds of commits behind it, so `git
          # merge-base` fails and the receipt exits 2. Drop the boundary first.
          # `--unshallow` errors on a complete clone, so only pass it while
          # `.git/shallow` exists. `--filter=blob:none` fetches the commit graph
          # without file contents.
          unshallow=()
          if [ -f .git/shallow ]; then unshallow=(--unshallow); fi
          git fetch --no-tags --filter=blob:none "${unshallow[@]}" origin "${{ github.base_ref || github.ref_name }}:refs/remotes/origin/${{ github.base_ref || github.ref_name }}"
          git fetch --no-tags --filter=blob:none https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          node --test scripts/fork-drift-receipt.test.mjs scripts/fork-sync-plan.test.mjs
          # Exit 1 means the release line is past its drift budget, which is
          # reported rather than failed. Exit 2 means the receipt itself broke.
          node scripts/fork-drift-receipt.mjs --base "origin/${{ github.base_ref || github.ref_name }}" || rc=$?
          if [ "${rc:-0}" -eq 2 ]; then exit 2; fi
        shell: bash

      - name: Guard indispensable AssemblyAI voice implementation
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const required = {
            'apps/server/src/speech/CloudSpeech.ts': ['assemblyai', 'sync.assemblyai.com/v1/transcribe', 'word_boost'],
            'apps/server/src/speech/CloudSpeech.test.ts': ['AssemblyAI', 'assemblyai'],
            'packages/contracts/src/speech.ts': ['assemblyai'],
            'apps/web/src/components/settings/CloudVoiceConfiguration.tsx': ['assemblyai'],
            'packages/contracts/src/threadInbox.ts': ['matchesInboxView', 'matchesInboxFilter', 'agent-only'],
            'packages/client-runtime/src/state/threadListFilter.ts': ['matchesPrimaryInbox', 'matchesListedInboxes', 'hiddenEnvironmentIds'],
            'apps/web/src/components/sidebar/SidebarThreadFilterMenu.tsx': ['Kameron', 'Jeff', 'Agents', 'Environments'],
            'apps/web/src/components/sidebar/threadListFilter.logic.ts': ['matchesListedInboxes', 'hiddenEnvironmentIds'],
          };
          for (const [file, needles] of Object.entries(required)) {
            const source = readFileSync(file, 'utf8');
            for (const needle of needles) {
              if (!source.includes(needle)) throw new Error(file + ' missing ' + needle);
            }
          }
          process.stdout.write('AssemblyAI voice + shared founder inbox source preserved\n');
          NODE

      - name: Typecheck contracts, runtime, provider and server
        shell: bash
        run: |
          set -euo pipefail
          vp run --filter @t3tools/contracts typecheck
          vp run --filter @t3tools/shared typecheck
          vp run --filter @t3tools/client-runtime typecheck
          vp run --filter @t3tools/provider-core typecheck
          vp run --filter t3 typecheck
          vp run --filter @t3tools/mobile typecheck

      - name: Test server voice, inbox and placement behavior
        shell: bash
        run: |
          set -euo pipefail
          vp test run \
            apps/server/src/speech/CloudSpeech.test.ts \
            apps/server/src/speech/GroqSpeechStream.test.ts \
            apps/server/src/speech/stream.test.ts \
            packages/contracts/src/threadInbox.test.ts \
            packages/contracts/src/threadInbox.invariants.test.ts \
            packages/contracts/src/threadInbox.upgrade.test.ts \
            packages/contracts/src/threadMetadataMcp.test.ts \
            apps/server/src/orchestration-v2/ThreadLaunchService.test.ts \
            apps/server/src/orchestration-v2/SubagentProjection.test.ts \
            apps/server/src/orchestration-v2/ModelAlertReactor.test.ts \
            apps/server/src/orchestration-v2/ThreadEventAlerts.test.ts \
            apps/server/src/orchestration-v2/DelegatedCompletionDelivery.test.ts \
            packages/shared/src/threadPlacement.test.ts \
            apps/server/src/peer/RemoteDelegation.test.ts \
            apps/server/src/mcp/OrchestratorMcpService.test.ts \
            apps/server/src/cli/thread.test.ts \
            apps/server/src/ws.test.ts \
            packages/contracts/src/scheduledTask.test.ts \
            apps/server/src/scheduledTasks/storedSchedule.test.ts \
            apps/server/src/scheduledTasks/Schedule.test.ts \
            apps/server/src/scheduledTasks/ScheduledTaskService.test.ts \
            apps/server/src/scheduledTasks/ScheduledTaskService.interval.test.ts \
            apps/server/src/scheduledTasks/ScheduledTaskService.schedule.test.ts \
            apps/server/src/scheduledTasks/ScheduledTaskService.webhook.test.ts \
            apps/server/src/scheduledTasks/ScheduledTaskService.placement.test.ts \
            apps/server/src/scheduledTasks/webhookRoute.test.ts \
            apps/server/src/persistence/Migrations.test.ts \
            apps/server/src/persistence/Migrations/102_ScheduledTaskOccurrences.test.ts \
            apps/server/src/orchestration-v2/HumanNote.test.ts \
            packages/contracts/src/environment.test.ts \
            scripts/feature-map.test.ts

      - name: Build native T3 server
        shell: bash
        run: vp run --filter t3 build:bundle

      # The fleet rollout ships the single executable, not the bundle. Its import guard
      # rejects a file-backed package loaded with import(), so a head that passes the
      # bundle build alone still fails the fleet build and never deploys.
      - name: Build native T3 single executable
        shell: bash
        run: node apps/server/scripts/cli.ts build-exe

      - name: Verify compiled server output
        shell: bash
        run: |
          set -euo pipefail
          test -f apps/server/dist/bin.mjs
          printf 'Exact T3 source %s, server build successful on %s\n' \
            "$(git rev-parse HEAD)" "$RUNNER_NAME"

  voice-and-inbox-web:
